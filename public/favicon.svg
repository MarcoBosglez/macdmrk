<svg xmlns="http://www.w3.org/2000/svg" width="676" height="676" viewBox="0 0 676 676" version="1.1">
	<!-- A solid filled silhouette (flood-filled interior — belly, wing
	     gap, etc — via fill-silhouette.js) rather than the thin/thick
	     outline style used elsewhere on the site. At real favicon sizes
	     (16-32px) the outline style just reads as an ambiguous blob;
	     thickening the outline further (tried up to radius 45) made it
	     worse, not better — the parallel inner/outer stroke edges start
	     colliding into arbitrary shapes rather than staying legible. A
	     solid silhouette keeps the actual recognizable outline (round
	     head, beak bump, round body, feet) crisp at any size, the way
	     real app icons/favicons are usually solid shapes rather than
	     fine outlines. -->
